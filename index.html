<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Prevent search engines from indexing this redirect page -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Basic redirect fallback -->
    <meta http-equiv="refresh" content="0; url=https://kashmirstay.in/">

    <title>Redirecting to Kashmir Stay...</title>

    <script>
        (function () {
            // New website domain
            const newDomain = "https://kashmirstay.in";

            // Keep the same path
            const path = window.location.pathname;

            // Keep URL parameters
            const query = window.location.search;

            // Keep URL hash
            const hash = window.location.hash;

            // Create final destination URL
            const newUrl = newDomain + path + query + hash;

            // Redirect immediately
            window.location.replace(newUrl);
        })();
    </script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #ffffff;
        }

        .redirect-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .redirect-box {
            padding: 30px;
        }

        .redirect-box h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: #222222;
        }

        .redirect-box p {
            margin: 0;
            font-size: 16px;
            color: #666666;
        }

        .redirect-box a {
            color: #007bff;
            text-decoration: none;
        }

        .redirect-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="redirect-container">
        <div class="redirect-box">
            <h1>Redirecting...</h1>

            <p>
                You are being redirected to
                <a href="https://kashmirstay.in/">
                    Kashmir Stay
                </a>
            </p>
        </div>
    </div>

    <noscript>
        <meta http-equiv="refresh" content="0; url=https://kashmirstay.in/">
    </noscript>

</body>
</html>
